# Cilium values — gatezero-platform
# Dipakai: helm upgrade --install cilium cilium/cilium -n kube-system -f values.yaml
# Verifikasi nama key terhadap versi chart yang dipakai (values bisa berubah antar rilis).

cluster:
  name: kirahadian.local
  id: 1

# --- menggantikan kube-proxy (ADR-0008) ---
kubeProxyReplacement: true
k8sServiceHost: 10.10.20.10        # VIP kube-vip
k8sServicePort: 6443

# --- datapath ---
routingMode: tunnel
tunnelProtocol: vxlan
# MTU = path MTU - 50 (VXLAN).
#   flat 1500  -> 1450
#   jumbo 9000 -> 8950
# Ukur dulu: ping -M do -s 8972 <node>
MTU: 1450

ipam:
  mode: kubernetes

# --- HA operator ---
operator:
  replicas: 2

# --- LoadBalancer tanpa MetalLB ---
l2announcements:
  enabled: true

# --- Ingress via Gateway API, tanpa Traefik ---
gatewayAPI:
  enabled: true

# --- visibilitas jaringan (demo NetworkPolicy & drop) ---
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http

# Aktifkan setelah kube-prometheus-stack terpasang
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false

bpf:
  masquerade: true

# Enkripsi pod-to-pod. Aktifkan SETELAH cluster stabil dan sudah diukur
# dampak throughput-nya (infra/benchmark). Bukan default saat instalasi awal.
encryption:
  enabled: false
  type: wireguard

# Jangan pasang CNI-conflict: kubeadm dijalankan dengan --skip-phases=addon/kube-proxy
