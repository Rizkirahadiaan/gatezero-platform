---
# Inventory cluster kirahadian.local
#
# ansible_host = IP manajemen = IP node (satu NIC, satu VLAN).
# Kalau nanti dipisah (mgmt vs cluster), tambahkan `node_ip` per host
# dan pakai itu untuk kubeadm advertiseAddress.
all:
  children:
    k8s_cluster:
      children:
        k8s_control_plane:
          children:
            # CP pertama = tempat kubeadm init
            k8s_cp_primary:
              hosts:
                k8s-cp-01:
                  ansible_host: 10.10.20.11
            # CP lain = join dengan --control-plane
            k8s_cp_secondary:
              hosts:
                k8s-cp-02:
                  ansible_host: 10.10.20.12
                k8s-cp-03:
                  ansible_host: 10.10.20.13
        k8s_workers:
          hosts:
            k8s-w-01:
              ansible_host: 10.10.20.21
            k8s-w-02:
              ansible_host: 10.10.20.22
            k8s-w-03:
              ansible_host: 10.10.20.23

  vars:
    ansible_user: ops
    ansible_python_interpreter: /usr/bin/python3
    # advertiseAddress kubelet/apiserver
    node_ip: "{{ ansible_host }}"
