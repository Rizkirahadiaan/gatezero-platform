---
# Lapis 4: mount options, permission file sensitif, cron/at.

# --- tmpfs ---------------------------------------------------------------
# /tmp noexec hanya aman bila build tool TIDAK jalan di host ini.
# Runner dengan kubernetes executor aman (build di dalam pod).

- name: Mount /tmp sebagai tmpfs dengan opsi aman
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: >-
      defaults,nodev,nosuid{{ ',noexec' if filesystem_tmp_noexec | bool else '' }},size={{ filesystem_tmp_size }}
    state: mounted

- name: Mount /var/tmp sebagai tmpfs dengan opsi aman
  ansible.posix.mount:
    path: /var/tmp
    src: tmpfs
    fstype: tmpfs
    opts: >-
      defaults,nodev,nosuid{{ ',noexec' if filesystem_var_tmp_noexec | bool else '' }},size={{ filesystem_var_tmp_size }}
    state: mounted

- name: Pasang opsi aman untuk /dev/shm
  ansible.posix.mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,nodev,nosuid,noexec,size={{ filesystem_dev_shm_size }}"
    state: mounted
  register: devshm_mount
  when: filesystem_dev_shm_enabled | bool

- name: Terapkan opsi /dev/shm tanpa reboot
  ansible.builtin.command: mount -o remount /dev/shm
  when:
    - filesystem_dev_shm_enabled | bool
    - devshm_mount is changed
  changed_when: true

# --- permission file sensitif -------------------------------------------

- name: Batasi permission /root
  ansible.builtin.file:
    path: /root
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Batasi permission file identitas
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: file
  loop:
    - { path: /etc/passwd,  group: root,   mode: "0644" }
    - { path: /etc/group,   group: root,   mode: "0644" }
    - { path: /etc/shadow,  group: shadow, mode: "0640" }
    - { path: /etc/gshadow, group: shadow, mode: "0640" }

# --- cron & at -----------------------------------------------------------

- name: Batasi direktori cron
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/cron.d
    - /etc/cron.daily
    - /etc/cron.hourly
    - /etc/cron.weekly
    - /etc/cron.monthly

- name: Batasi /etc/crontab
  ansible.builtin.file:
    path: /etc/crontab
    owner: root
    group: root
    mode: "0600"

- name: Hanya root boleh memakai cron
  ansible.builtin.copy:
    dest: /etc/cron.allow
    content: "root\n"
    owner: root
    group: root
    mode: "0640"

- name: Hanya root boleh memakai at
  ansible.builtin.copy:
    dest: /etc/at.allow
    content: "root\n"
    owner: root
    group: root
    mode: "0640"

- name: Hapus deny-list cron/at
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cron.deny
    - /etc/at.deny

# --- laporan (tidak diperbaiki otomatis) --------------------------------
# Memperbaiki permission sembarangan bisa merusak aplikasi.

- name: Cari file world-writable di luar pengecualian
  ansible.builtin.shell: |
    set -eu
    find / -xdev -type f -perm -0002 \
      {% for p in filesystem_world_writable_exclude %} -not -path '{{ p }}/*'{% endfor %} \
      2>/dev/null | head -50
  args:
    executable: /bin/bash
  register: world_writable
  changed_when: false
  failed_when: false

- name: Laporkan file world-writable
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ world_writable.stdout_lines | length }} file world-writable
      (maks 50 ditampilkan). Tinjau manual, jangan chmod massal.
  when: world_writable.stdout_lines | length > 0

# --- verifikasi ----------------------------------------------------------

- name: Verifikasi opsi mount
  ansible.builtin.command: findmnt -no TARGET,OPTIONS /tmp /var/tmp /dev/shm
  register: mount_opts
  changed_when: false

- name: Tampilkan opsi mount
  ansible.builtin.debug:
    msg: "{{ mount_opts.stdout_lines }}"

- name: Pastikan /tmp dan /var/tmp punya nodev
  ansible.builtin.assert:
    that:
      - mount_opts.stdout is search('/tmp.*nodev')
      - mount_opts.stdout is search('/var/tmp.*nodev')
    fail_msg: "Opsi mount tidak sesuai: {{ mount_opts.stdout_lines }}"
    success_msg: "mount hardening aktif"
