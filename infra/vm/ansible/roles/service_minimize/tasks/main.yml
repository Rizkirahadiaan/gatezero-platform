---
# Lapis 5: minimalisasi layanan & paket.

# --- nonaktifkan layanan -------------------------------------------------

- name: Cek unit yang ada
  ansible.builtin.command: systemctl list-unit-files --type=service --no-legend
  register: unit_files
  changed_when: false

- name: Nonaktifkan layanan yang tidak dipakai
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ service_minimize_disable }}"
  when:
    - service_minimize_disable | length > 0
    - ("{{ item }}.service" in unit_files.stdout)
  failed_when: false

# --- hapus paket (opt-in) ------------------------------------------------

- name: Hapus paket yang tidak dibutuhkan
  ansible.builtin.apt:
    name: "{{ service_minimize_remove }}"
    state: absent
    purge: true
    autoremove: true
  when: service_minimize_remove | length > 0

# --- laporan -------------------------------------------------------------

- name: Inventaris port yang listen
  ansible.builtin.shell: |
    set -eu
    ss -tulpnH | awk '{print $1" "$5}' | sort -u
  args:
    executable: /bin/bash
  register: listening
  changed_when: false

- name: Tampilkan port yang listen
  ansible.builtin.debug:
    msg: "{{ listening.stdout_lines }}"
