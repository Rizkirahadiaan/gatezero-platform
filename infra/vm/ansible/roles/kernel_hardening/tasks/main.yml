---
# Lapis 3: kernel sysctl + blacklist module.

# --- sysctl --------------------------------------------------------------

- name: Tambahkan sysctl IPv6 mati bila diminta
  ansible.builtin.set_fact:
    kernel_sysctl_all: >-
      {{ kernel_sysctl | combine({
           'net.ipv6.conf.all.disable_ipv6': '1',
           'net.ipv6.conf.default.disable_ipv6': '1'
         }) }}
  when: not kernel_enable_ipv6 | bool

- name: Gunakan daftar sysctl tanpa disable IPv6
  ansible.builtin.set_fact:
    kernel_sysctl_all: "{{ kernel_sysctl }}"
  when: kernel_enable_ipv6 | bool

- name: Terapkan sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    sysctl_set: true
    state: present
    reload: false
  loop: "{{ kernel_sysctl_all | dict2items }}"
  notify: reload sysctl

# --- module blacklist ----------------------------------------------------

- name: Template blacklist module
  ansible.builtin.template:
    src: 99-blacklist.conf.j2
    dest: /etc/modprobe.d/99-blacklist.conf
    owner: root
    group: root
    mode: "0644"
  notify: update initramfs

# --- verifikasi ----------------------------------------------------------

- name: Terapkan sysctl sekarang (agar verifikasi akurat)
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Verifikasi sysctl kunci
  ansible.builtin.command: >-
    sysctl -n kernel.kptr_restrict kernel.dmesg_restrict
    fs.protected_hardlinks net.ipv4.tcp_syncookies
  register: sysctl_check
  changed_when: false

- name: Pastikan nilai sysctl sesuai
  ansible.builtin.assert:
    that:
      - sysctl_check.stdout_lines[0] | trim == (kernel_kptr_restrict | string)
      - sysctl_check.stdout_lines[1] | trim == (kernel_dmesg_restrict | string)
      - sysctl_check.stdout_lines[2] | trim == '1'
      - sysctl_check.stdout_lines[3] | trim == '1'
    fail_msg: "sysctl tidak sesuai: {{ sysctl_check.stdout_lines }}"
    success_msg: "sysctl hardening aktif"
