---
# Semua VM di platform. Grup `vms` = target baseline hardening.
#
# Port di sini dipakai role nftables_firewall:
#   firewall_allowed_tcp            -> boleh dari jaringan cluster (10.10.20.0/24)
#   firewall_allowed_from_world_tcp -> boleh dari mana saja (hanya untuk service publik)
#
# Jangan taruh port yang tidak dipakai. Lebih sedikit port = lebih sedikit alasan
# penyerang menyentuh VM ini.
all:
  children:
    vms:
      children:
        services:
          hosts:
            jumpbox:
              ansible_host: 10.10.20.5
            gitlab-prod:
              ansible_host: 10.10.20.6
              firewall_allowed_tcp: [2222]
              firewall_allowed_from_world_tcp: [80, 443]
            svc-sonar-01:
              ansible_host: 10.10.20.7
              firewall_allowed_tcp: [9000]
            svc-nexus-01:
              ansible_host: 10.10.20.8
              firewall_allowed_tcp: [8081, 8082, 8083, 8084]
            svc-s3-01:
              ansible_host: 10.10.20.9
              firewall_allowed_tcp: [9000, 9001]

        k8s_nodes:
          children:
            k8s_control_plane:
              hosts:
                k8s-cp-01:
                  ansible_host: 10.10.20.11
                k8s-cp-02:
                  ansible_host: 10.10.20.12
                k8s-cp-03:
                  ansible_host: 10.10.20.13
            k8s_workers:
              hosts:
                k8s-w-01:
                  ansible_host: 10.10.20.21
                k8s-w-02:
                  ansible_host: 10.10.20.22
                k8s-w-03:
                  ansible_host: 10.10.20.23

  vars:
    ansible_user: ops
    ansible_python_interpreter: /usr/bin/python3
