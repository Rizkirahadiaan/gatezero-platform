# Jalankan: pre-commit install && pre-commit autoupdate
# Tujuan: lokal == CI. Tidak ada lagi "di CI gagal, di laptop lolos".
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  # ---------- hygiene dasar ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^platform/gitops/overlays/.*\.enc\.yaml$
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------- secret detection (WAJIB, terkait SOPS) ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (detect plaintext secret)

  # ---------- YAML / Dockerfile / shell ----------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.2
    hooks:
      - id: shellcheck

  # ---------- konvensi commit ----------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, chore, ci, refactor, test, security, revert]

  # ---------- hook lokal (butuh tool terpasang) ----------
  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform (manifest kubernetes)
        entry: kubeconform -strict -ignore-missing-schemas -summary
        language: system
        files: ^(platform/gitops|security)/.*\.yaml$
        exclude: \.enc\.yaml$

      - id: sops-encrypted
        name: sops (pastikan *.enc.yaml benar-benar terenkripsi)
        entry: bash -c 'shopt -s nullglob; f=(platform/bootstrap/*/*.enc.yaml platform/gitops/overlays/*/*.enc.yaml); [ ${#f[@]} -eq 0 ] || sops filestatus "${f[@]}"'
        language: system
        pass_filenames: false
        files: \.enc\.yaml$

      - id: no-latest-tag
        name: tolak image tag :latest
        entry: bash -c '! grep -rn "image:.*:latest" --include="*.yaml" .'
        language: system
        pass_filenames: false
        files: ^(platform|apps)/.*\.yaml$
